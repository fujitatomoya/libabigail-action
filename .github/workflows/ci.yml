# Self-test: build the fixture .so files and run the action against each
# pair to verify every verdict is produced correctly.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read          # publish-dry-run downloads this run's artifacts

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh

  # Comment rendering, verdict aggregation, artifact loading, label
  # reconciliation and the workflow_run publish flow, against a fake Octokit.
  unit-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: post-comment.js unit tests
        run: node test/test-publish.js

  # Exit bitmap + canned abidiff reports (test/reports/) -> verdict.
  unit-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode-verdict.sh unit tests
        run: bash test/test-decode-verdict.sh

  fixtures-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          # 'libabigail-tools' was renamed to 'abigail-tools' on Debian 12+ /
          # Ubuntu 24.04+. Prefer the new name, fall back for older runners.
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential abigail-tools; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential libabigail-tools
          fi
      - name: Build fixtures
        working-directory: test/fixtures
        run: make
      - name: Verify libraries contain DWARF
        working-directory: test/fixtures
        run: |
          for f in build/*.so; do
            test -f "$f"
            readelf -S "$f" | grep -q '\.debug_info'
          done
      # public-headers-regexp: generator + run-abidiff.sh + decode-verdict.sh
      # against the pimpl / byvalue fixtures (needs abidiff and abidw).
      - name: public-headers-suppressions.py unit tests
        run: bash test/test-public-headers.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: test/fixtures/build/

  verdict-compatible:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v1)
        id: abi
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v1.so
          fail-on: incompatible
          comment-pr: 'false'
          report-name: abidiff-report-compatible
      - name: Assert verdict == compatible
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "compatible"

  verdict-additions-only:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v2)
        id: abi
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v2.so
          fail-on: incompatible
          comment-pr: 'false'
          report-name: abidiff-report-additions
      - name: Assert verdict == additions-only
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "additions-only"

  verdict-incompatible:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v3, fail-on=none)
        id: abi
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v3.so
          fail-on: none
          comment-pr: 'false'
          report-name: abidiff-report-incompatible
      - name: Assert verdict == incompatible
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "incompatible"

  # Regression test for the exit-code-4-only case: a modified declaration
  # (return type change, same symbol) makes abidiff exit with ABIDIFF_ABI_CHANGE
  # alone. The verdict must come from the report's changes-summary lines, not
  # the bitmap — a bitmap-only decode mislabels this as additions-only.
  verdict-changed-incompatible:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v4, fail-on=none)
        id: abi
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v4.so
          fail-on: none
          comment-pr: 'false'
          report-name: abidiff-report-changed
      - name: Assert verdict == incompatible
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "incompatible"

  # unreferenced-symbols: 'false' passes --no-unreferenced-symbols through to
  # abidiff; the fixtures carry DWARF for every symbol, so the verdict is the
  # same as with the default and the job only proves the flag is accepted.
  verdict-no-unreferenced-symbols:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v2, unreferenced-symbols=false)
        id: abi
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v2.so
          unreferenced-symbols: 'false'
          fail-on: incompatible
          comment-pr: 'false'
          report-name: abidiff-report-no-unreferenced-symbols
      - name: Assert verdict == additions-only and the flag reached abidiff
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "additions-only"
          test "${{ steps.abi.outputs.exit-code }}" = "4"

  # public-headers-regexp: the private layout change and the removed private
  # member function of the pimpl fixture are implementation detail, so the
  # verdict is additions-only (new private members, libstdc++ instantiations)
  # with ABIDIFF_ABI_CHANGE alone; without the regexp this pair is a break
  # (test/test-public-headers.sh covers that side).
  verdict-public-headers:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (pimpl base vs private, public-headers-regexp)
        id: abi
        uses: ./
        with:
          base-lib: build/libpimpl-base.so
          head-lib: build/libpimpl-private.so
          public-headers-regexp: '(^|/)include/'
          unreferenced-symbols: 'false'
          fail-on: incompatible
          comment-pr: 'false'
          report-name: abidiff-report-public-headers
      - name: Assert verdict == additions-only
        run: |
          test "${{ steps.abi.outputs.verdict }}" = "additions-only"
          test "${{ steps.abi.outputs.exit-code }}" = "4"

  verdict-incompatible-fails:
    needs: fixtures-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: build/
      - name: Run libabigail-action (v1 vs v3, fail-on=incompatible) — expect failure
        id: abi
        continue-on-error: true
        uses: ./
        with:
          base-lib: build/libfoo-v1.so
          head-lib: build/libfoo-v3.so
          fail-on: incompatible
          comment-pr: 'false'
          report-name: abidiff-report-incompatible-fails
      - name: Assert action step failed and verdict == incompatible
        run: |
          if [[ "${{ steps.abi.outcome }}" != "failure" ]]; then
            echo "Expected the step to fail but outcome was ${{ steps.abi.outcome }}"
            exit 1
          fi
          test "${{ steps.abi.outputs.verdict }}" = "incompatible"

  # End-to-end check of the publish sub-action against the report bundles the
  # verdict jobs above uploaded to this very run: download them by pattern and
  # aggregate the verdicts (worst wins -> incompatible). Every write is
  # disabled, so only the outputs are asserted. On push / dispatch there is no
  # pull request, and the action must then exit cleanly with an empty pr-number.
  publish-dry-run:
    needs:
      - verdict-compatible
      - verdict-additions-only
      - verdict-incompatible
      - verdict-changed-incompatible
      - verdict-no-unreferenced-symbols
      - verdict-public-headers
      - verdict-incompatible-fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish (dry run, no comment, no labels)
        id: publish
        uses: ./publish
        with:
          run-id: ${{ github.run_id }}
          artifact-pattern: abidiff-report-*
          comment-pr: 'false'
      - name: Assert aggregated verdict and PR resolution
        env:
          EVENT: ${{ github.event_name }}
          VERDICT: ${{ steps.publish.outputs.verdict }}
          COUNT: ${{ steps.publish.outputs.count }}
          PR: ${{ steps.publish.outputs.pr-number }}
        run: |
          echo "verdict=$VERDICT count=$COUNT pr-number=$PR"
          test "$COUNT" = "7"
          test "$VERDICT" = "incompatible"
          if [[ "$EVENT" == "pull_request" ]]; then
            test -n "$PR"
          else
            test -z "$PR"
          fi
